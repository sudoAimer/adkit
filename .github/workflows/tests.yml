name: CPU tests
on:
  pull_request:
  push:
    branches: [main, 'codex/superadd-*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,subspacead,superadd]'
      - name: Run offline tests
        env:
          HF_HUB_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
        run: python -m pytest -q

# adkit 的安装元数据、可选依赖和命令行入口。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adkit"
version = "0.1.0"
description = "Offline visual anomaly detection with explicit constructor parameters"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision", "timm>=1.0", "safetensors", "numpy", "scipy", "scikit-learn", "opencv-python", "Pillow", "PyYAML"]

[project.optional-dependencies]
# Web 工作台依赖独立安装，核心算法库不强制引入 Web 框架。
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.20,<1"]
test = ["pytest", "httpx", "fastapi>=0.115,<1", "python-multipart>=0.0.20,<1"]
reference = ["faiss-cpu", "matplotlib", "tifffile", "tqdm", "pandas", "kornia"]
subspacead = ["transformers==4.57.6"]
superadd = ["timm>=1.0.20"]

[project.scripts]
adkit = "adkit.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
